<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kura</title>
    <script>
      var storedPrefs = null;
      try { storedPrefs = JSON.parse(localStorage.getItem("kura.prefs")); } catch (e) {}
      function applyTheme(prefs) {
        document.documentElement.dataset.theme = prefs && prefs.darkMode === true ? "dark" : "light";
      }
      applyTheme(storedPrefs);
    </script>
    <link rel="icon" type="image/svg+xml" href="/static/icons/shelf.svg">
    <link rel="stylesheet" href="/kura.css">
  </head>
  <body>
    <script src="/dist/elm.js"></script>
    <script src="/browser-import.js"></script>
  <script src="/moderation-preview.js"></script>
    <script>
      var app = Elm.Main.init({
        flags: {
          apiBase: "",
          prefs: storedPrefs,
          width: window.innerWidth,
          height: window.innerHeight
        }
      });
      if (window.KuraBrowserImport) { window.KuraBrowserImport.wire(app); }
      if (window.KuraModerationPreview) { window.KuraModerationPreview.wire(app); }
      if (app.ports && app.ports.savePrefs) {
        app.ports.savePrefs.subscribe(function (prefs) {
          applyTheme(prefs);
          try { localStorage.setItem("kura.prefs", JSON.stringify(prefs)); } catch (e) {}
        });
      }
      if (app.ports && app.ports.profileDirty) {
        app.ports.profileDirty.subscribe(function (dirty) {
          window.__kuraProfileDirty = dirty === true;
        });
        window.addEventListener("beforeunload", function (event) {
          if (window.__kuraProfileDirty) {
            event.preventDefault();
            event.returnValue = "";
          }
        });
      }
    </script>
  </body>
</html>
