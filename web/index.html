<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kura</title>
    <link rel="icon" type="image/svg+xml" href="/static/icons/shelf.svg">
    <link rel="stylesheet" href="/kura.css">
  </head>
  <body>
    <script src="/dist/elm.js"></script>
    <script>
      var storedPrefs = null;
      try { storedPrefs = JSON.parse(localStorage.getItem("kura.prefs")); } catch (e) {}
      var app = Elm.Main.init({
        flags: {
          apiBase: "http://localhost:8080",
          prefs: storedPrefs,
          width: window.innerWidth,
          height: window.innerHeight
        }
      });
      if (app.ports && app.ports.savePrefs) {
        app.ports.savePrefs.subscribe(function (prefs) {
          try { localStorage.setItem("kura.prefs", JSON.stringify(prefs)); } catch (e) {}
        });
      }
    </script>
  </body>
</html>
